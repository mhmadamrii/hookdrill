# API only. Postgres is the existing kommers_postgres_1 (database `hookdrill`) and the
# web app is deployed on Vercel.
# podman compose --env-file .env.production up -d --build
services:
  hookdrill_api:
    build:
      context: .
      target: api
    image: hookdrill-api
    container_name: hookdrill_api
    restart: unless-stopped
    environment: &api-env
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: https://${API_HOST:-api.hookdrill.yappers.online}
      WEB_ORIGIN: https://${WEB_HOST:-hookdrill.yappers.online}
      API_PORT: '3001'
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.hookdrill.yappers.online}
    networks: [proxy]

  # One-off: podman compose --env-file .env.production run --rm migrate
  migrate:
    image: hookdrill-api
    profiles: [tools]
    environment: *api-env
    command: sh -c "pnpm db:migrate && pnpm db:sync-challenges"
    networks: [proxy]

networks:
  # Network shared with Caddy and kommers_postgres_1 (`podman network ls` on the VPS).
  proxy:
    external: true
    name: ${CADDY_NETWORK:-kommers_default}
